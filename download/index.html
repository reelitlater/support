    .store-btn { display:flex; align-items:center; justify-content:center; gap:10px; background:#fff; color:#000; padding:12px 14px; border-radius:13px; text-decoration:none; transition:transform .15s,box-shadow .15s; }
    .store-btn:hover { transform:translateY(-1px); box-shadow:0 6px 16px rgba(0,0,0,.3); }
    .store-btn svg { width:22px; height:22px; flex-shrink:0; }
    .store-btn .text { text-align:left; line-height:1.05; }
    .store-btn .top { font-size:9.5px; opacity:.65; font-weight:500; letter-spacing:.02em; }
    .store-btn .bot { font-size:15px; font-weight:700; margin-top:2px; }
    .phones { position:relative; height:clamp(380px,100vw,560px); }
    .phone { position:absolute; top:50%; width:44%; aspect-ratio:920/2000; border-radius:clamp(20px,5vw,36px); overflow:hidden; border:3px solid #3a3f4e; background:#2a211e; box-shadow:0 30px 60px rgba(0,0,0,.55); }
    .phone img { width:100%; height:100%; object-fit:cover; display:block; }
    .phone.l { left:2%; transform:translateY(-50%) scale(.86); opacity:.85; }
    .phone.r { right:2%; transform:translateY(-50%) scale(.86); opacity:.85; }
    .phone.c { left:28%; transform:translateY(-50%); z-index:2; border-color:#4a4f5e; }
    footer { text-align:center; color:rgba(255,255,255,.3); font-size:12px; padding:0 20px 32px; }
    @media (min-width:900px) {
      .wrap { grid-template-columns:1fr 1.05fr; min-height:100vh; padding:40px 40px; }

    }
